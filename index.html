<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>云阙</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1526; }
    #app { width: 100%; height: 100%; }
    #keys { position: fixed; right: 16px; bottom: 16px; color: #7d8aa5; font-size: 12px;
      font-family: ui-sans-serif, system-ui, "PingFang SC", sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="keys">WASD 移动 · 空格 跃下滑翔 · 滑翔中 W 俯冲 / S 抬头 / AD 转向 · 靠近小星球即降落，星球上 WASD 绕行 · 空格 再启程</div>
  <div id="toast" style="position:fixed;left:50%;top:30%;transform:translateX(-50%);color:#dfe6f2;font-size:26px;letter-spacing:.3em;opacity:0;transition:opacity .5s;pointer-events:none;font-family:ui-serif,'Songti SC',serif;"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
